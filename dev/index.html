<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Memola dev shell</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; background: #fafaf7; }
    #dev-banner {
      padding: 8px 16px; background: #fff3cd; border-bottom: 1px solid #ffe69c;
      font-size: 13px; color: #664d03;
    }
    #dev-banner code { background: rgba(0,0,0,0.05); padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="dev-banner">
    <strong>Memola dev shell</strong> — SharePoint REST はモック。本番挙動 (etag / ACL / publish) は実機で確認してください。
    <em>ライブリロード有効: src を編集すると自動で再読込されます。</em>
  </div>
  <script>
    // Live-reload loader: fetches the freshly-built main.js and reloads
    // automatically when esbuild rewrites it (polls /__ver). See
    // dev/loader.js. Cache-bust so the loader itself is always current.
    var l = document.createElement('script');
    l.src = '/loader.js?t=' + Date.now();
    document.body.appendChild(l);
  </script>
</body>
</html>
