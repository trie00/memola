<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Memola dev shell</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; background: #fafaf7; }
    #dev-banner {
      padding: 8px 16px; background: #fff3cd; border-bottom: 1px solid #ffe69c;
      font-size: 13px; color: #664d03;
    }
    #dev-banner code { background: rgba(0,0,0,0.05); padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="dev-banner">
    <strong>Memola dev shell</strong> — SharePoint REST はモック。本番挙動 (etag / ACL / publish) は実機で確認してください。
  </div>
  <script>
    // Cache-bust on every load — Chrome can cache /main.js across
    // reloads even with `Cache-Control: no-store`. Inject the script
    // dynamically with a fresh query string so the browser refetches.
    const s = document.createElement('script');
    s.src = '/main.js?t=' + Date.now();
    document.body.appendChild(s);
  </script>
</body>
</html>
